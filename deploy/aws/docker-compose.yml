# Maskroom on the server: images from the HMS registry, nothing built here.
#
#   cd /hms/apps/masking
#   cp .env.example .env && $EDITOR .env         # once
#   docker login repo.hsenidmobile.com          # once
#   docker compose pull && docker compose --profile keycloak up -d
#
# Publishes only loopback ports; the platform's nginx container joins this
# project's network ("maskroom_default") and proxies https://$MASKROOM_DOMAIN to
# the containers by name (nginx/safepii.conf). See docs/DEPLOY_AWS.md.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_USER: maskroom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: maskroom
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maskroom -d maskroom"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    image: repo.hsenidmobile.com/hms_data/maskroom:${MASKROOM_VERSION:-latest}
    restart: unless-stopped
    mem_limit: 2500m
    depends_on:
      db:
        condition: service_healthy
    environment:
      MASKROOM_DATABASE_URL: postgresql+psycopg://maskroom:${POSTGRES_PASSWORD}@db:5432/maskroom
      MASKROOM_DATA_DIR: /data
      PII_TOKEN_SALT: ${PII_TOKEN_SALT:?set PII_TOKEN_SALT in .env}
      MASKROOM_AUTH_MODE: ${MASKROOM_AUTH_MODE:-oidc}
      # Back-channel discovery over the compose network; Keycloak still reports the
      # public https issuer (KC_HOSTNAME_BACKCHANNEL_DYNAMIC below).
      MASKROOM_OIDC_ISSUER: http://keycloak:8180/sso/realms/maskroom
      MASKROOM_OIDC_CLIENT_ID: maskroom
      MASKROOM_OIDC_CLIENT_SECRET: ${MASKROOM_OIDC_CLIENT_SECRET:?set MASKROOM_OIDC_CLIENT_SECRET in .env}
      MASKROOM_SECRET_KEY: ${MASKROOM_SECRET_KEY:?set MASKROOM_SECRET_KEY in .env}
      MASKROOM_SESSION_HOURS: ${MASKROOM_SESSION_HOURS:-12}
      MASKROOM_ADMIN_EMAILS: ${MASKROOM_ADMIN_EMAILS:-}
      MASKROOM_PUBLIC_URL: https://${MASKROOM_DOMAIN:?set MASKROOM_DOMAIN in .env}
      MASKROOM_API_KEY: ${MASKROOM_API_KEY:-}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-24}
      AUDIT_TTL_DAYS: ${AUDIT_TTL_DAYS:-90}
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/api/config',timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 3
    stop_grace_period: 320s

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    profiles: ["keycloak"]
    restart: unless-stopped
    mem_limit: 1024m
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_HTTP_PORT: 8180
      KC_HTTP_RELATIVE_PATH: /sso
      KC_HOSTNAME: https://${MASKROOM_DOMAIN}/sso
      KC_HOSTNAME_STRICT: "true"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
      # Substituted into keycloak/realm-maskroom.json by the import (${VAR} placeholders).
      MASKROOM_DOMAIN: ${MASKROOM_DOMAIN}
      MASKROOM_OIDC_CLIENT_SECRET: ${MASKROOM_OIDC_CLIENT_SECRET}
      KC_STAFF_PASSWORD: ${KC_STAFF_PASSWORD:-staff}
      KC_ADMIN_USER_PASSWORD: ${KC_ADMIN_USER_PASSWORD:-admin}
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
      - kcdata:/opt/keycloak/data/h2

volumes:
  pgdata:
  kcdata:
