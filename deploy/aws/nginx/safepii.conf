# Maskroom behind the platform's nginx container. Mounted from /hms/apps/masking/nginx
# into /etc/nginx/conf.d/. Upstreams are resolved at request time through Docker's DNS
# so nginx starts even while Maskroom is down (502 until it is back).

server {
    listen 80;
    server_name safepii.hsenidmobile.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name safepii.hsenidmobile.com;

    ssl_certificate     /etc/nginx/certs/safepii.hsenidmobile.com.cer;
    ssl_certificate_key /etc/nginx/certs/safepii.hsenidmobile.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL_maskroom:10m;
    ssl_prefer_server_ciphers on;

    # Uploads: the extension caps at 25 MB; the app has no cap of its own.
    client_max_body_size 30m;
    proxy_request_buffering off;

    # Long requests: scanned-PDF OCR can take minutes (gunicorn timeout is 300 s).
    proxy_read_timeout 330s;
    proxy_send_timeout 330s;
    proxy_connect_timeout 10s;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $maskroom_app      http://maskroom-app-1:8080;
    set $maskroom_keycloak http://maskroom-keycloak-1:8180;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header Connection "";

    # Maskroom's own Keycloak (sign-on) under /sso/
    location /sso/ {
        proxy_pass $maskroom_keycloak;
    }

    # Everything else: the Maskroom app (UI, API, extension feed)
    location / {
        proxy_pass $maskroom_app;
    }
}
