# Maskroom with Postgres beside it.
#   Local dev (app on the host, database in Docker):
#       docker compose up -d db
#       export MASKROOM_DATABASE_URL=postgresql+psycopg://maskroom:maskroom@localhost:5432/maskroom
#       pii_env/bin/python webui/app.py
#   Everything in Docker:
#       cp .env.example .env   # then set the secrets
#       docker compose up -d --build
#   With the bundled identity provider (see the keycloak service below):
#       docker compose --profile keycloak up -d
# Change POSTGRES_PASSWORD (and the URL) before exposing anything.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-maskroom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maskroom}
      POSTGRES_DB: ${POSTGRES_DB:-maskroom}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"   # host access for local dev only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-maskroom} -d ${POSTGRES_DB:-maskroom}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      MASKROOM_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-maskroom}:${POSTGRES_PASSWORD:-maskroom}@db:5432/${POSTGRES_DB:-maskroom}
      MASKROOM_DATA_DIR: /data
      PII_TOKEN_SALT: ${PII_TOKEN_SALT:-}   # REQUIRED for real use: set it in .env
      # Sign-on. "oidc" needs the three MASKROOM_OIDC_* values (any OpenID
      # Connect provider, or the keycloak service below); "off" keeps the legacy
      # shared keys for local demos only.
      MASKROOM_AUTH_MODE: ${MASKROOM_AUTH_MODE:-off}
      MASKROOM_OIDC_ISSUER: ${MASKROOM_OIDC_ISSUER:-}
      MASKROOM_OIDC_CLIENT_ID: ${MASKROOM_OIDC_CLIENT_ID:-maskroom}
      MASKROOM_OIDC_CLIENT_SECRET: ${MASKROOM_OIDC_CLIENT_SECRET:-}
      MASKROOM_OIDC_SCOPES: ${MASKROOM_OIDC_SCOPES:-openid email profile}
      MASKROOM_SECRET_KEY: ${MASKROOM_SECRET_KEY:-}
      MASKROOM_SESSION_HOURS: ${MASKROOM_SESSION_HOURS:-12}
      MASKROOM_ADMIN_EMAILS: ${MASKROOM_ADMIN_EMAILS:-}
      MASKROOM_PUBLIC_URL: ${MASKROOM_PUBLIC_URL:-}
      # Legacy shared keys (auth mode "off"; MASKROOM_API_KEY is also accepted
      # as a deprecated service key in oidc mode during a rollout).
      MASKROOM_API_KEY: ${MASKROOM_API_KEY:-}
      MASKROOM_ADMIN_KEY: ${MASKROOM_ADMIN_KEY:-}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-24}
      AUDIT_TTL_DAYS: ${AUDIT_TTL_DAYS:-90}
    volumes:
      - appdata:/data          # uploads, audit files, the extension .crx (ext/)
    ports:
      - "${MASKROOM_BIND:-0.0.0.0}:${MASKROOM_PORT:-8080}:8080"   # MASKROOM_BIND=127.0.0.1 behind a proxy
    stop_grace_period: 320s    # let a long OCR request finish

  # Fallback identity provider for organisations without one:
  #   docker compose --profile keycloak up -d db keycloak
  # Admin console: http://localhost:8180 (KEYCLOAK_ADMIN / KEYCLOAK_ADMIN_PASSWORD).
  # The realm "maskroom" is imported from deploy/aws/keycloak/realm-maskroom.json
  # with client "maskroom" and two example users (staff/staff, admin/admin).
  # start-dev is for development; production runs `start --optimized` with
  # its own Postgres, KC_HOSTNAME and TLS in front (see README).
  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    profiles: ["keycloak"]
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_PORT: 8180
      # ${VAR} placeholders in deploy/aws/keycloak/realm-maskroom.json (dev defaults)
      MASKROOM_DOMAIN: ${MASKROOM_DOMAIN:-localhost}
      MASKROOM_OIDC_CLIENT_SECRET: ${MASKROOM_OIDC_CLIENT_SECRET:-change-me-maskroom-dev-secret}
      KC_STAFF_PASSWORD: ${KC_STAFF_PASSWORD:-staff}
      KC_ADMIN_USER_PASSWORD: ${KC_ADMIN_USER_PASSWORD:-admin}
    volumes:
      - ./deploy/aws/keycloak:/opt/keycloak/data/import:ro
    ports:
      - "127.0.0.1:8180:8180"

volumes:
  pgdata:
  appdata:
