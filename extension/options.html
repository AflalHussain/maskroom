<!doctype html>
<html><head><meta charset="utf-8"><title>Maskroom settings</title>
<style>
:root{
  --bg:#f1f5f9; --surface:#fff; --surface-2:#f8fafc; --border:#e2e8f0; --border-strong:#cbd5e1;
  --text:#0f172a; --text-2:#475569; --text-3:#7a8aa0; --brand:#3a5c86; --brand-soft:#eef2f7;
  --primary:#1e2a3a; --primary-hover:#111a27; --on-primary:#fff;
  --ok:#067647; --bad:#b42318; --ring:rgba(58,92,134,.30);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
body{font:13.5px/1.55 var(--sans);margin:0;padding:20px;min-width:380px;background:var(--bg);color:var(--text)}
.head{display:flex;align-items:center;gap:9px;margin-bottom:16px}
.logo{width:24px;height:24px;border-radius:6px;background:linear-gradient(150deg,#4a6b96,#26405f);display:inline-grid;place-items:center}
.logo::after{content:"";width:12px;height:3px;border-radius:1px;background:#fff;box-shadow:0 4px 0 rgba(255,255,255,.55)}
.head .name{font-weight:800;font-size:15px}
.head .tag{font:600 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--text-3)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(16,24,40,.05)}
h2{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-2);margin:0 0 12px}
label.top{display:block;margin:12px 0 5px;color:var(--text-3);font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
label.top:first-child{margin-top:0}
input[type=text],input[type=password],select{width:100%;background:var(--surface);border:1px solid var(--border-strong);color:var(--text);padding:8px 10px;border-radius:7px;font:13px var(--sans)}
input:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--ring)}
.row{display:flex;align-items:flex-start;gap:9px;margin-top:11px}
.row input[type=checkbox]{accent-color:var(--brand);width:15px;height:15px;margin-top:2px}
.row label{margin:0;color:var(--text);font-size:13px;line-height:1.45}
.row.sub{padding-left:24px} .row.sub label{color:var(--text-2)}
.actions{display:flex;gap:8px;margin-top:16px}
button{background:var(--primary);color:var(--on-primary);border:1px solid var(--primary);border-radius:7px;padding:8px 15px;font:600 13px var(--sans);cursor:pointer}
button:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
button.ghost{background:var(--surface);border:1px solid var(--border-strong);color:var(--text)}
button.ghost:hover{background:var(--surface-2)}
#status{margin-top:11px;font-size:12.5px;color:var(--text-3);min-height:1.3em;font-family:var(--mono)}
#status.ok{color:var(--ok)} #status.bad{color:var(--bad)}
#log{font:11.5px/1.5 var(--mono);color:var(--text-2);max-height:180px;overflow:auto;white-space:pre-wrap;background:var(--surface-2);border:1px solid var(--border);border-radius:7px;padding:10px;margin-bottom:10px}
.note{color:var(--text-3);font-size:12px;margin:4px 0 0}
.note b{color:var(--text-2)}
</style></head>
<body>
<div class="head"><span class="logo"></span><span class="name">Maskroom</span><span class="tag">for Claude</span></div>

<div class="card">
  <h2>Connection</h2>
  <label class="top" for="serverUrl">Maskroom server URL</label>
  <input type="text" id="serverUrl" placeholder="http://127.0.0.1:5170">
  <label class="top" for="apiKey">API key (if the server sets MASKROOM_API_KEY)</label>
  <input type="password" id="apiKey">
  <div class="actions"><button id="save">Save</button><button class="ghost" id="test">Test connection</button></div>
  <div id="status"></div>
</div>

<div class="card">
  <h2>Masking</h2>
  <div class="row"><input type="checkbox" id="guard"><label for="guard">Guard: Enter/send masks unmasked text first</label></div>
  <div class="row"><input type="checkbox" id="unmask"><label for="unmask">Show real values in replies (on screen only)</label></div>
  <div class="row"><input type="checkbox" id="preamble"><label for="preamble">Prepend the token instruction once per session</label></div>
  <label class="top" for="excelAttach">Attach masked Excel as</label>
  <select id="excelAttach">
    <option value="xlsx">masked workbook (.xlsx) — claude.ai needs analysis enabled to read it</option>
    <option value="md">Markdown tables (.md) — readable by any chat surface</option>
  </select>
</div>

<div class="card">
  <h2>Downloads</h2>
  <div class="row"><input type="checkbox" id="interceptDownloads"><label for="interceptDownloads">Restore files downloaded from claude.ai automatically (saved as *_restored)</label></div>
  <div class="row sub"><input type="checkbox" id="keepMasked"><label for="keepMasked">Also keep the masked (token) copy next to the restored file — useful for demos</label></div>
  <h2 style="margin-top:16px">Recent downloads</h2>
  <div id="log"></div>
  <div class="actions"><button class="ghost" id="copylog">Copy log</button><button class="ghost" id="clearlog">Clear</button></div>
</div>

<p class="note">Use <b>Mask file</b> on the bar for .xlsx/.pdf attachments; with guard on, files dropped or picked in
claude.ai go through Maskroom too. Not supported by Anthropic; depends on claude.ai's page structure.</p>
<script src="options.js"></script>
</body></html>
