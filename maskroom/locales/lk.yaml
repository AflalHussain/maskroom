# Sri Lanka locale for maskroom.
# Everything country-specific lives here: identifier formats, phone formats,
# local honorifics, address vocabulary and a place gazetteer. See
# _template.yaml for the schema and README "Localizing to another country".
code: lk
name: Sri Lanka
phone_regions:
  - LK
  - US
  - GB
  - IN
enable_builtin: []
identifiers:
  - entity: LK_NIC
    description: 'National Identity Card: old 9 digits + V/X, new 12 digits starting with birth year'
    patterns:
      - name: lk_nic_old
        regex: \b\d{9}[VvXx]\b
        score: 0.8
      - name: lk_nic_new
        regex: \b(?:19|20)\d{10}\b
        score: 0.45
    context:
      - nic
      - national
      - identity
    column_header: \bnic\b|national id
    profile:
      regex: (?:\d{9}[VvXx]|(?:19|20)\d{10})
      validator: lk_nic
  - entity: LK_PASSPORT
    description: 'Passport: N/D/S prefix + 7 digits (needs context)'
    patterns:
      - name: lk_passport
        regex: \b[NDS]\d{7}\b
        score: 0.3
    context:
      - passport
      - travel
    column_header: passport
    profile:
      regex: '[NDS]\d{7}'
      validator: null
phone_patterns:
  - name: lk_mobile
    regex: (?<!\d)(?:\+94[- ]?|0)7\d[- ]?\d{3}[- ]?\d{4}(?!\d)
    score: 0.65
  - name: lk_landline
    regex: (?<!\d)(?:\+94[- ]?|0)[1-9]\d[- ]?\d{3}[- ]?\d{4}(?!\d)
    score: 0.45
phone_profile_regex: (?:\+94[- ]?|0)[1-9]\d[- ]?\d{3}[- ]?\d{4}
