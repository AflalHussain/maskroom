<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maskroom · Admin audit</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%233b567d'/%3E%3Cstop offset='1' stop-color='%231e2e44'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='7.5' fill='url(%23g)'/%3E%3Crect x='8' y='9.4' width='16' height='2.6' rx='1.3' fill='%23fff' opacity='.55'/%3E%3Crect x='8' y='14.4' width='16' height='3.2' rx='1.6' fill='%23fff'/%3E%3Crect x='8' y='19.8' width='10' height='2.6' rx='1.3' fill='%23fff' opacity='.55'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/static/theme.css">
<style>
.top{display:flex;align-items:center;gap:16px;padding:13px 24px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
.top .right{margin-left:auto;display:flex;align-items:center;gap:10px}
.top .right #who{font-family:var(--mono);font-size:12px;color:var(--text-3)}
.wrap{padding:22px 24px;display:flex;flex-direction:column;gap:18px;max-width:1400px;margin:0 auto;width:100%}
.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:end;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow-sm)}
.filters .field{gap:5px}
.filters input,.filters select{min-width:132px}
.act{color:var(--brand);font-weight:600}
.pager{display:flex;gap:12px;align-items:center;font-size:12.5px;color:var(--text-3)}
tbody tr[data-id]{cursor:pointer}
.scrim{position:fixed;inset:0;background:rgba(16,24,40,.45);opacity:0;visibility:hidden;transition:opacity .18s;z-index:15}
.scrim.on{opacity:1;visibility:visible}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(780px,96vw);background:var(--bg);border-left:1px solid var(--border);
  box-shadow:var(--shadow-lg);transform:translateX(100%);transition:transform .2s;overflow:auto;padding:22px 24px;display:flex;flex-direction:column;gap:16px;z-index:20}
.drawer.on{transform:translateX(0)}
.drawer h2{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text-2)}
.kv{display:grid;grid-template-columns:140px 1fr;gap:7px 14px;font-size:13px}
.kv .k{color:var(--text-3)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:680px){.duo{grid-template-columns:1fr}}
.pane .cap{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text-3);margin-bottom:6px}
.pane .cap.out{color:var(--brand)}
.box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;font-family:var(--mono);font-size:12px;line-height:1.55;white-space:pre-wrap;word-break:break-word;max-height:360px;overflow:auto}
mark{background:var(--brand-soft);color:var(--text);border-radius:3px;padding:0 3px}
.dl{display:flex;gap:10px;flex-wrap:wrap}
.dl a{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:8px 13px;color:var(--text);background:var(--surface)}
.dl a:hover{background:var(--surface-2);text-decoration:none}
.gate{max-width:400px;margin:12vh auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow-md)}
.gate h2{font-size:18px;font-weight:700}
.hide{display:none}
</style>
</head>
<body>
<header class="top">
  <div class="mr-brand"><span class="mr-logo"></span><span class="name">Maskroom</span><span class="tag">Admin audit</span></div>
  <div class="right">
    <span id="who"></span>
    <button class="ghost" id="refresh">refresh</button>
    <button class="ghost" id="signout">sign out</button>
    <button class="icon-btn" id="themebtn" title="Toggle light/dark">◐</button>
  </div>
</header>

<div id="gate" class="gate hide">
  <h2>Admin sign-in</h2>
  <p class="muted" style="font-size:13px">Enter the admin key (server <code>MASKROOM_ADMIN_KEY</code>) to view the audit trail.</p>
  <input type="password" id="adminkey" placeholder="admin key" autocomplete="off">
  <button class="primary" id="signin">Sign in</button>
  <div class="err" id="gateerr"></div>
</div>

<main id="app" class="wrap hide">
  <div class="tiles" id="tiles"></div>

  <div class="filters">
    <label>user <input type="text" id="f-user" placeholder="email / id"></label>
    <label>action <select id="f-action">
      <option value="">any</option><option value="mask">mask</option><option value="unmask">unmask</option>
      <option value="process">process (file)</option><option value="unmask-file">unmask-file</option>
      <option value="restore-file">restore-file</option></select></label>
    <label>from <input type="date" id="f-since"></label>
    <label>to <input type="date" id="f-until"></label>
    <label>search <input type="text" id="f-q" placeholder="user / file / session"></label>
    <button class="primary" id="apply">Apply</button>
    <button class="ghost" id="clear">Clear</button>
  </div>

  <div class="tablewrap">
    <table>
      <thead><tr><th>Time (UTC)</th><th>User</th><th>Action</th><th>Kind</th><th>Masked / restored</th><th>Entities</th><th>File</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <div class="pager">
    <button class="ghost" id="prev">‹ prev</button>
    <span id="pageinfo"></span>
    <button class="ghost" id="next">next ›</button>
  </div>
  <div class="err" id="listerr"></div>
</main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer"></aside>

<script>
const $=s=>document.querySelector(s);
const themeBtn=()=>document.querySelector("#themebtn");
function applyTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem("maskroom-theme",t)}catch(e){}const b=themeBtn();if(b)b.textContent=t==="light"?"◑":"◐";}
let __savedTheme=null;try{__savedTheme=localStorage.getItem("maskroom-theme")}catch(e){}
applyTheme(__savedTheme||"light");
document.addEventListener("click",(e)=>{if(e.target&&e.target.id==="themebtn")applyTheme(document.documentElement.dataset.theme==="light"?"dark":"light");});
const TOKEN_RE=/TOK_[A-Z0-9_]+_[0-9A-F]{8,}/g;
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hl=s=>esc(s).replace(TOKEN_RE,m=>`<mark>${m}</mark>`);
let KEY=""; try{KEY=localStorage.getItem("maskroom-admin-key")||""}catch(e){}
let cfg={admin_auth_required:true};
let offset=0, limit=50, total=0;

async function api(path){
  const h={}; if(KEY)h["X-Admin-Key"]=KEY;
  const r=await fetch(path,{headers:h});
  if(r.status===401)throw {code:401,message:"Admin key required or invalid."};
  let d=null; try{d=await r.json()}catch(e){}
  if(!r.ok)throw {code:r.status,message:(d&&d.error)||r.statusText};
  return d;
}

function showGate(msg){ $("#gate").classList.remove("hide"); $("#app").classList.add("hide"); if(msg)$("#gateerr").textContent=msg; }
function showApp(){ $("#gate").classList.add("hide"); $("#app").classList.remove("hide"); }

function showDisabled(){
  $("#gate").classList.remove("hide"); $("#app").classList.add("hide");
  $("#gate").innerHTML='<h2>Audit dashboard disabled</h2>'+
    '<p class="muted" style="font-size:13px">This dashboard holds sensitive data and is off until an admin key is configured. '+
    'Set <code>MASKROOM_ADMIN_KEY</code> on the server and reload.</p>';
}
async function boot(){
  try{ cfg=await (await fetch("/api/config")).json(); }catch(e){}
  if(!cfg.admin_auth_required){ showDisabled(); return; }   // server has no admin key configured
  if(!KEY){ showGate(""); return; }
  try{ await loadAll(); showApp(); }
  catch(e){ if(e.code===401){ KEY=""; showGate("Invalid admin key."); }
            else if(e.code===403){ showDisabled(); } else showGate(e.message||"Error"); }
}

async function loadAll(){ await Promise.all([loadStats(), loadList()]); }

async function loadStats(){
  const s=await api("/api/audit/stats");
  const acts=Object.entries(s.by_action||{}).map(([k,v])=>`${k}: ${v}`).join("\n")||"—";
  const users=Object.keys(s.by_user||{}).length;
  $("#tiles").innerHTML=`
    <div class="tile"><div class="k">total records</div><div class="v">${s.total}</div></div>
    <div class="tile"><div class="k">distinct users</div><div class="v">${users}</div></div>
    <div class="tile"><div class="k">by action</div><div class="sub">${esc(acts)}</div></div>
    <div class="tile"><div class="k">retention</div><div class="v">${s.ttl_days? s.ttl_days : "∞"}</div><div class="sub">${s.ttl_days?"days, then deleted":"kept forever"}</div></div>`;
  $("#who").textContent=`${s.total} records`;
}

function dayEpoch(id,end){ const v=$(id).value; if(!v)return ""; const d=new Date(v+"T00:00:00Z"); if(end)d.setUTCDate(d.getUTCDate()+1); return Math.floor(d.getTime()/1000); }

async function loadList(){
  const p=new URLSearchParams();
  const u=$("#f-user").value.trim(); if(u)p.set("user",u);
  const a=$("#f-action").value; if(a)p.set("action",a);
  const q=$("#f-q").value.trim(); if(q)p.set("q",q);
  const since=dayEpoch("#f-since",false); if(since)p.set("since",since);
  const until=dayEpoch("#f-until",true); if(until)p.set("until",until);
  p.set("limit",limit); p.set("offset",offset);
  const d=await api("/api/audit?"+p.toString());
  total=d.total;
  $("#rows").innerHTML=d.records.map(r=>{
    const chips=Object.entries(r.by_entity||{}).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<span class="chip">${esc(k)} ${v}</span>`).join("")||`<span class="muted">${r.entity_total||0}</span>`;
    const file=r.has_input_file?`<span class="muted">${esc(r.filename||"file")}</span>`:'<span class="muted">—</span>';
    return `<tr data-id="${r.id}">
      <td>${esc(r.iso.replace("T"," ").slice(0,19))}</td>
      <td>${esc(r.user)}</td>
      <td class="act">${esc(r.action)}</td>
      <td>${esc(r.kind||"text")}</td>
      <td>${r.entity_total||0}</td>
      <td>${chips}</td>
      <td>${file}</td></tr>`;
  }).join("")||`<tr><td colspan="7" class="muted" style="padding:18px">No records match.</td></tr>`;
  const from=total?offset+1:0, to=Math.min(offset+limit,total);
  $("#pageinfo").textContent=`${from}–${to} of ${total}`;
  $("#prev").disabled=offset<=0; $("#next").disabled=offset+limit>=total;
  document.querySelectorAll("#rows tr[data-id]").forEach(tr=>tr.addEventListener("click",()=>openDetail(tr.dataset.id)));
  $("#listerr").textContent="";
}

async function openDetail(id){
  let r; try{ r=await api("/api/audit/"+id); }catch(e){ $("#listerr").textContent=e.message; return; }
  const q=KEY?"?admin_key="+encodeURIComponent(KEY):"";
  const hasFiles=r.input_file||r.output_file;
  // For restore/unmask operations the input is the masked file and the output
  // is the unmasked (restored) file; for mask operations it's the reverse.
  const isRestore=(r.action==="unmask"||r.action==="unmask-file"||r.action==="restore-file");
  const inLabel=isRestore?"masked":"original", outLabel=isRestore?"unmasked":"masked";
  const inLabelText=isRestore?"input (masked)":"input (original)";
  const textBlock=(r.input_text!=null||r.output_text!=null)?`
    <div class="duo">
      <div class="pane"><div class="cap">${inLabelText}</div><div class="box">${isRestore?hl(r.input_text):esc(r.input_text)}</div></div>
      <div class="pane"><div class="cap out">output (${outLabel})</div><div class="box">${isRestore?esc(r.output_text):hl(r.output_text)}</div></div>
    </div>`:"";
  const fileBlock=hasFiles?`<div class="dl">
      ${r.input_file?`<a href="/api/audit/${id}/file/input${q}" download>⬇ ${inLabel} file</a>`:""}
      ${r.output_file?`<a href="/api/audit/${id}/file/output${q}" download>⬇ ${outLabel} file</a>`:""}
    </div>`:"";
  const chips=Object.entries(r.by_entity||{}).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<span class="chip">${esc(k)} ${v}</span>`).join("");
  const unres=(r.unresolved&&r.unresolved.length)?`<div class="pane"><div class="cap">unresolved tokens</div><div class="box">${r.unresolved.map(esc).join("\n")}</div></div>`:"";
  $("#drawer").innerHTML=`
    <div style="display:flex;align-items:center;gap:10px"><h2 style="flex:1">Record ${esc(id)}</h2><button class="ghost" id="close">close</button></div>
    <div class="kv">
      <div class="k">time (UTC)</div><div>${esc(r.iso.replace("T"," ").slice(0,19))}</div>
      <div class="k">user</div><div>${esc(r.user)}</div>
      <div class="k">action</div><div class="act">${esc(r.action)}</div>
      <div class="k">kind</div><div>${esc(r.kind||"text")}</div>
      <div class="k">session</div><div>${esc(r.session_id||"—")}</div>
      <div class="k">ip</div><div>${esc(r.ip||"—")}</div>
      ${r.filename?`<div class="k">filename</div><div>${esc(r.filename)}</div>`:""}
      <div class="k">entities</div><div>${chips||("total "+(r.entity_total||0))}</div>
    </div>
    ${fileBlock}
    ${textBlock}
    ${unres}`;
  $("#close").addEventListener("click",closeDetail);
  $("#drawer").classList.add("on"); $("#scrim").classList.add("on");
}
function closeDetail(){ $("#drawer").classList.remove("on"); $("#scrim").classList.remove("on"); }

// events
$("#signin").addEventListener("click",()=>{ KEY=$("#adminkey").value.trim(); try{localStorage.setItem("maskroom-admin-key",KEY)}catch(e){} boot(); });
$("#adminkey").addEventListener("keydown",e=>{ if(e.key==="Enter")$("#signin").click(); });
$("#signout").addEventListener("click",()=>{ KEY=""; try{localStorage.removeItem("maskroom-admin-key")}catch(e){} showGate(""); });
$("#refresh").addEventListener("click",()=>loadAll().catch(e=>$("#listerr").textContent=e.message));
$("#apply").addEventListener("click",()=>{ offset=0; loadList().catch(e=>$("#listerr").textContent=e.message); });
$("#clear").addEventListener("click",()=>{ ["#f-user","#f-q","#f-since","#f-until"].forEach(i=>$(i).value=""); $("#f-action").value=""; offset=0; loadList(); });
$("#f-q").addEventListener("keydown",e=>{ if(e.key==="Enter")$("#apply").click(); });
$("#f-user").addEventListener("keydown",e=>{ if(e.key==="Enter")$("#apply").click(); });
$("#prev").addEventListener("click",()=>{ offset=Math.max(0,offset-limit); loadList(); });
$("#next").addEventListener("click",()=>{ offset+=limit; loadList(); });
$("#scrim").addEventListener("click",closeDetail);
document.addEventListener("keydown",e=>{ if(e.key==="Escape")closeDetail(); });

boot();
</script>
</body>
</html>
